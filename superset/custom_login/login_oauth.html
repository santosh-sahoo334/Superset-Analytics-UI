<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSight Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('/static/assets/images/login-background-dfact.svg') center/cover no-repeat;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(231, 229, 229, 0.1);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 15px 15px 45px rgba(0, 0, 0, 0.1);
            min-width: 500px;
            width: 100%;
            max-width: 1000px;
            z-index: 3;
            position: relative;
            border: 1px solid rgb(245, 246, 248);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            max-width: 150px;
            height: auto;
        }

        h1 {
            color: #333;
            font-size: 28px;
            font-weight: normal;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(221, 221, 221, 0.5);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #4052AB;
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 0 0 3px rgba(64, 82, 171, 0.1);
        }

        button {
            background: rgba(64, 82, 171, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: rgba(51, 66, 147, 1);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(64, 82, 171, 0.2);
        }

        .icon-user {
            width: 16px;
            height: 16px;
        }

        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4052AB;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="loader" class="loader-container">
        <div class="loader"></div>
    </div>

    <div id="content" class="hidden">
        <div class="card">
            <div class="logo">
                <img src="/static/assets/images/csight.png" alt="CSIGHT Logo">
            </div>

            <h1>Sign in</h1>

            <form id="signInForm">
                <div class="form-group">
                    <label for="email">User Name</label>
                    <input type="email" id="email" placeholder="Email address" required>
                </div>

                <button type="submit">
                    <svg class="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    Next
                </button>
            </form>
        </div>
    </div>

    <script>
        const REFRESH_TOKEN = 'refresh_token';
        const SLUG_KEY = 'slug';
        // For Ushur Frontend & Backend URL will change. Below ones for TekSecur Demo Instance
        const CSIGHT_DOMAIN = '{{ appbuilder.app.config["CSIGHT_DOMAIN"] }}';
        const backendAPIURL = '{{ appbuilder.app.config["CSIGHT_BACKEND"] }}';

        function showLoader() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('content').classList.add('hidden');
        }

        function hideLoader() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
        }


        // Check for tokens and handle authentication on page load
        document.addEventListener('DOMContentLoaded', async function () {
            showLoader();
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            // Check for OIDC tokens
            const oidc_refresh_token = Cookies.get("oidc_refresh_token");
            console.log("OIDC Refresh Token:", oidc_refresh_token);
            const oidc_access_token = Cookies.get("oidc_access_token");
            console.log("OIDC Access Token:", oidc_access_token);
            
            // print cookies for debugging, specifically looking for 'domain' cookie
            console.log("All Cookies:", Cookies.get());
            console.log("Domain Cookie:", Cookies.get('domain'));
            
            
            if (slug) {
                Cookies.set(SLUG_KEY, slug, {
                    path: "/",  
                });
            }

            if (oidc_refresh_token) {
                // Handle token storage

                Cookies.remove("session", {
                    path: "/"
                });
                Cookies.remove("session", {
                    path: "/",
                    domain: ".teksecur.com"
                    // domain: ".peerislands.io"
                });

                Cookies.set(REFRESH_TOKEN, oidc_refresh_token, {
                    path: "/",  
                });

                // Clean up OIDC cookies - remove from both default path and .teksecur.com domain
                Cookies.remove("oidc_refresh_token", {
                    path: "/"
                });
                Cookies.remove("oidc_refresh_token", {
                    path: "/",
                    domain: ".teksecur.com"
                    //domain: ".peerislands.io"
                });
                Cookies.remove("oidc_access_token", {
                    path: "/"
                });
                Cookies.remove("oidc_access_token", {
                    path: "/",
                    domain: ".teksecur.com"
                    //domain: ".peerislands.io"
                });
            }
            // Check for refresh token and slug
            const refreshToken = Cookies.get(REFRESH_TOKEN);
            const storedSlug = Cookies.get(SLUG_KEY);

            if (refreshToken && storedSlug) {
                
                Cookies.remove("session", {
                    path: "/"
                 });
                Cookies.remove("session", {
                    path: "/",
                    domain: ".teksecur.com"
                    //domain: ".peerislands.io"
                });

                try {
                    const response = await fetch(
                        `${CSIGHT_DOMAIN}/oauth-authorized/csight-auth-success?slug=${storedSlug}`,
                        {
                            method: "GET",
                            credentials: 'include',
                            headers: {
                                'refresh_token': refreshToken,
                                'Accept': 'application/json',
                                'Content-Type': 'application/json'
                            }
                        }
                    );

                    // Handle successful authentication
                    if (response.ok) {
                        window.location.replace(`/dworks/dashboard/${storedSlug}`);
                    }else {
                        hideLoader();
                    }
                } catch (error) {
                    console.error('Authentication error:', error);
                    hideLoader();
                }
            }else {
                Cookies.remove("session", {
                    path: "/"
                });
                hideLoader();
            }
        });

        // Handle form submission
        document.getElementById('signInForm').addEventListener('submit', function (e) {
            e.preventDefault();

            let email = btoa(document.getElementById('email').value);
            // Construct the authentication URL with the user's email
            const authUrl = `${backendAPIURL}/api/v1/oidc/login/?email=${email}`;

            // Redirect to the authentication URL
            window.location.href = authUrl;
        });
    </script>
</body>

</html>
