<!-- extend base layout -->
{% extends "appbuilder/base.html" %} {% block content %}

<script nonce="RQ3QrOBw4IY1sZyReRUNpPgeMOpcd1ONvIgK2Ghj2zc=">
  function signin(provider) {
    window.location.href = baseLoginUrl + provider + next
  }
</script>

<script type="text/javascript" nonce="RQ3QrOBw4IY1sZyReRUNpPgeMOpcd1ONvIgK2Ghj2zc=">
  var baseLoginUrl = '{{appbuilder.get_url_for_login}}'
  var baseRegisterUrl = '{{appbuilder.get_url_for_login}}'
  var rawNext = "{{request.args.get('next', '') | safe}}";
  // var next = '?next=' + encodeURIComponent("{{request.args.get('next', '') | safe}}")
  // Function to validate the 'next' value
  function validateNext(nextValue) {
      // Allow only HTTPS URLs or relative paths with optional query parameters
      const validNextRegex = /^(https:\/\/[a-zA-Z0-9._~:/?#\[\]@!$&'()*+,;=%-]+|\/[a-zA-Z0-9/_\-.:]*(\?[a-zA-Z0-9&=_%.-]*)?)$/;
      return validNextRegex.test(nextValue);
  }
  // Validate and encode the 'next' value
  var next = '';
  if (validateNext(rawNext)) {
      next = '?next=' + encodeURIComponent(rawNext);
  } else {
      console.warn('Invalid "next" parameter detected. Defaulting to home page.');
      next = '';
  }
  document.addEventListener('DOMContentLoaded', function() {
        const signinLinks = document.querySelectorAll('[id^="signin-"]');
        signinLinks.forEach(link => {
            link.addEventListener('click', function() {
                const provider = this.id.replace('signin-', '');
                window.location.href = baseLoginUrl + provider + next;
            });
        });
    });

  function hideNavbar() {
    const navbar = document.querySelector('#app-menu')
    if (navbar && navbar.style) {
      navbar.style.display = 'none'
    }
    const container = document.querySelector('.container')
    if (container && container.style) {
      container.style.width = '100%'
    }
  }
  hideNavbar()
  setTimeout(() => {
    hideNavbar()
  }, 1000)
</script>

<div class="container" style="
    min-height: 100vh;
    background-image: url('/static/assets/images/login-background-dworks.svg');
    background-position: center;
    background-size: cover;
    width: 100%;
  ">
  <div id="loginbox" style="display: flex; justify-content: center; align-items: center; margin-top: 80px">
    <div style="background: #fff; padding: 40px; border-radius: 4px; min-width: 400px; box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.1)">
      <div class="text-center mb-5">
        <img src="/static/assets/images/superset-logo-horiz.png" alt="Image" height="85" style="margin-bottom: 20px" />
        <div style="margin-bottom: 20px; font-size: 25px; font-weight: 600">DWorks Refuel Analytics</div>
      </div>

      <div style="margin-top: 50px">
        {% for provider in providers %}
        <a id="signin-{{provider.name}}" class="btn btn-primary btn-block" nonce="RQ3QrOBw4IY1sZyReRUNpPgeMOpcd1ONvIgK2Ghj2zc=" type="submit">
          {% if provider.name == 'okta' %}
              {{_('Login with SSO')}}
          {% else %}
              {{_('Admin Login')}}
          {% endif %}
          <i id="{{provider.name}}"></i>
        </a>
        {% endfor %}
      </div>
    </div>
  </div>
</div>

{% endblock %}
