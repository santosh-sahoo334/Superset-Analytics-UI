version: 0.2

cache:
  paths:
    - '/root/.npm/**/*'
    - '/root/.cache/npm/**/*'
    - 'superset-frontend/node_modules/**/*'
    - 'node_modules/**/*'

phases:
  install:
    runtime-versions:
      nodejs: 16
    commands:
      - npm config set registry https://registry.npmjs.org/
      - npm config set fetch-retries 5
      - npm config set fetch-retry-factor 5
      - npm config set fetch-retry-mintimeout 20000
      - npm config set fetch-retry-maxtimeout 120000  
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - REPOSITORY_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY_NAME}
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      # Enable Docker Buildkit
      - echo '{ "features": { "buildkit": true } }' > /etc/docker/daemon.json
      - systemctl restart docker
  
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg NODE_OPTIONS="--max-old-space-size=8192" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from $REPOSITORY_URI:security-fix \
          -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:security-fix
  
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:security-fix
      - printf '{"ImageURI":"%s"}' $REPOSITORY_URI:$IMAGE_TAG > imageDetail.json

artifacts:
  files:
    - imageDetail.json
    - appspec.yml
    - taskdef.json